version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: pureshop-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pureshop_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pureshop_password}
      POSTGRES_DB: ${POSTGRES_DB:-pureshop_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    networks:
      - pureshop-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pureshop_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: pureshop-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"      # AMQP port
      - "15672:15672"    # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - pureshop-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: pureshop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pureshop-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command: redis-server --appendonly yes

  # API Gateway
  api-gateway:
    build:
      context: ../services/api-gateway
      dockerfile: Dockerfile
    container_name: pureshop-api-gateway
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-key}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}
      AUTH_SERVICE_URL: http://auth-service:3001
      CATALOG_SERVICE_URL: http://catalog-service:3002
      INVENTORY_SERVICE_URL: http://inventory-service:3003
      ORDER_SERVICE_URL: http://order-service:3004
    ports:
      - "3000:3000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - pureshop-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Auth Service
  auth-service:
    build:
      context: ../services/auth-service
      dockerfile: Dockerfile
    container_name: pureshop-auth-service
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
      DATABASE_URL: postgresql://${POSTGRES_USER:-pureshop_user}:${POSTGRES_PASSWORD:-pureshop_password}@postgres:5432/${POSTGRES_DB:-pureshop_db}?schema=auth
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-key}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - pureshop-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Catalog Service
  catalog-service:
    build:
      context: ../services/catalog-service
      dockerfile: Dockerfile
    container_name: pureshop-catalog-service
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3002
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
      DATABASE_URL: postgresql://${POSTGRES_USER:-pureshop_user}:${POSTGRES_PASSWORD:-pureshop_password}@postgres:5432/${POSTGRES_DB:-pureshop_db}?schema=catalog
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-key}
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pureshop-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Inventory Service
  inventory-service:
    build:
      context: ../services/inventory-service
      dockerfile: Dockerfile
    container_name: pureshop-inventory-service
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3003
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
      DATABASE_URL: postgresql://${POSTGRES_USER:-pureshop_user}:${POSTGRES_PASSWORD:-pureshop_password}@postgres:5432/${POSTGRES_DB:-pureshop_db}?schema=inventory
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-key}
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - pureshop-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Order Service
  order-service:
    build:
      context: ../services/order-service
      dockerfile: Dockerfile
    container_name: pureshop-order-service
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3004
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
      DATABASE_URL: postgresql://${POSTGRES_USER:-pureshop_user}:${POSTGRES_PASSWORD:-pureshop_password}@postgres:5432/${POSTGRES_DB:-pureshop_db}?schema=orders
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-key}
      CATALOG_SERVICE_URL: http://catalog-service:3002
      INVENTORY_SERVICE_URL: http://inventory-service:3003
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - pureshop-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Payment Service
  payment-service:
    build:
      context: ../services/payment-service
      dockerfile: Dockerfile
    container_name: pureshop-payment-service
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3005
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
      DATABASE_URL: postgresql://${POSTGRES_USER:-pureshop_user}:${POSTGRES_PASSWORD:-pureshop_password}@postgres:5432/${POSTGRES_DB:-pureshop_db}?schema=payment
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_your_stripe_secret_key}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_your_webhook_secret}
      STRIPE_API_VERSION: ${STRIPE_API_VERSION:-2023-10-16}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      IDEMPOTENCY_KEY_ENABLED: ${IDEMPOTENCY_KEY_ENABLED:-true}
    ports:
      - "3005:3005"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - pureshop-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Notification Service
  notification-service:
    build:
      context: ../services/notification-service
      dockerfile: Dockerfile
    container_name: pureshop-notification-service
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3006
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_SECURE: ${MAIL_SECURE:-false}
      MAIL_USER: ${MAIL_USER:-your-email@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-your-app-password}
      MAIL_FROM: ${MAIL_FROM:-noreply@pureshop.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-PureShop}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      WEBSOCKET_NAMESPACE: ${WEBSOCKET_NAMESPACE:-notifications}
      WEBSOCKET_CORS_ORIGIN: ${WEBSOCKET_CORS_ORIGIN:-*}
      MAX_NOTIFICATION_HISTORY: ${MAX_NOTIFICATION_HISTORY:-100}
    ports:
      - "3006:3006"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - pureshop-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3006/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  pureshop-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local
  redis_data:
    driver: local