services:
  postgres:
    image: postgres:16
    container_name: pureshop-postgres
    environment:
      POSTGRES_DB: pureshop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pureshop-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: pureshop-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pureshop-network

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    container_name: pureshop-auth-service
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/pureshop"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672"
      JWT_SECRET: super-secret
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - pureshop-network
    restart: unless-stopped

  catalog-service:
    build:
      context: .
      dockerfile: apps/catalog-service/Dockerfile
    container_name: pureshop-catalog-service
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/pureshop"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - pureshop-network
    restart: unless-stopped

  inventory-service:
    build:
      context: .
      dockerfile: apps/inventory-service/Dockerfile
    container_name: pureshop-inventory-service
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/pureshop"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - pureshop-network
    restart: unless-stopped

  orders-service:
    build:
      context: .
      dockerfile: apps/orders-service/Dockerfile
    container_name: pureshop-orders-service
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/pureshop"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - pureshop-network
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: pureshop-api-gateway
    ports:
      - "3000:3000"
    environment:
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672"
    depends_on:
      - rabbitmq
      - auth-service
      - catalog-service
      - inventory-service
      - orders-service
    networks:
      - pureshop-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  pureshop-network:
    driver: bridge

  
